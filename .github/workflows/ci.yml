name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Slow balance tests (slice 2 §10.4); a no-op until the script exists.
      - run: npm run test:balance --if-present
      - run: npm run build
